<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTBEE Polychromies — Rapport d'étude</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ocre:#7C4F1E;--ocre-light:#9a6530;--ocre-pale:#f5ead8;--ocre-text:#5a3610;
  --surface-0:#f8f5f0;--surface-1:#f0ebe2;--surface-2:#ffffff;
  --text-primary:#1a1a18;--text-secondary:#5a5a56;--text-muted:#9a9a94;
  --border:rgba(0,0,0,0.10);--radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--surface-0);color:var(--text-primary);font-size:14px}
.header{background:var(--ocre);color:#fff;padding:0 0 0 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.header-inner{max-width:900px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px}
.header-logo{width:36px;height:36px;border-radius:9px;background:#000;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}.header-logo img{width:28px;height:28px;object-fit:contain}
.header-text{}
.header-title{font-size:15px;font-weight:700}
.header-sub{font-size:11px;opacity:0.8;margin-top:1px}
.page{max-width:900px;margin:0 auto;padding:32px 24px 64px}
.hero{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:28px 32px;margin-bottom:28px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.hero-title{font-size:22px;font-weight:700;margin-bottom:6px}
.hero-sub{font-size:13px;color:var(--text-muted);margin-bottom:16px}
.hero-meta{display:flex;flex-wrap:wrap;gap:12px}
.meta-chip{display:inline-flex;align-items:center;gap:6px;background:var(--ocre-pale);color:var(--ocre-text);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500}
.section{margin-bottom:28px}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--ocre-pale)}
.section-icon{font-size:18px}
.section-title{font-size:15px;font-weight:700;color:var(--ocre)}
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.field-grid{grid-template-columns:1fr}}
.field-item{}
.field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);margin-bottom:3px}
.field-value{font-size:13px;color:var(--text-primary);line-height:1.5}
.text-block{font-size:13px;line-height:1.7;color:var(--text-secondary);white-space:pre-wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
.badge-warning{background:#fff3cd;color:#856404}
.badge-danger{background:#f8d7da;color:#721c24}
.badge-ok{background:#d4edda;color:#155724}
.badge-info{background:var(--ocre-pale);color:var(--ocre-text)}
/* Photo grid */
.photo-section{margin-bottom:20px}
.photo-cat-title{font-size:12px;font-weight:600;color:var(--ocre-text);background:var(--ocre-pale);display:inline-block;padding:3px 10px;border-radius:10px;margin-bottom:10px}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.photo-card{border-radius:10px;overflow:hidden;background:var(--surface-1);border:1px solid var(--border);cursor:pointer;transition:transform 0.15s,box-shadow 0.15s}
.photo-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.12)}
.photo-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.photo-caption{padding:6px 10px;font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Stratigraphie */
.strati-table{width:100%;border-collapse:collapse;font-size:12px}
.strati-table th{background:var(--ocre-pale);color:var(--ocre-text);padding:8px 10px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
.strati-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.4}
.strati-table tr:nth-child(even) td{background:var(--surface-0)}
.strati-table tr:last-child td{border-bottom:none}
.strati-n{font-weight:700;color:var(--ocre);text-align:center}
/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:8000;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 0.2s}
.lightbox.open{opacity:1;pointer-events:all}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain}
.lb-close{position:absolute;top:20px;right:24px;color:#fff;font-size:28px;cursor:pointer;line-height:1}
/* Empty / loading */
.loading{text-align:center;padding:60px 20px;color:var(--text-muted)}
.not-found{text-align:center;padding:80px 20px}
.not-found-icon{font-size:48px;margin-bottom:16px}
.divider{border:none;border-top:1px solid var(--border);margin:20px 0}
</style>
</head>

const TABLE = 'buildings';

const catLabels = {
  generale:'Vue générale', localisation:'Localisation', lumiere_rasante:'Lumière rasante',
  uv:'Fluorescence UV', ir:'Infrarouge', detail:'Détail / Macro',
  degradation:'Dégradation', prelevement:'Prélèvement', apres:'Après intervention', autre:'Autre'
};

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(location.search);
const workId = params.get('id');

async function init() {
  if (!workId) { showError('Aucun dossier spécifié'); return; }
  const {data, error} = await sb.from(TABLE).select('*').eq('id', workId).single();
  if (error||!data) { showError('Dossier introuvable'); return; }
  renderWork(data.data, data.created_at);
}

function showError(msg) {
  document.getElementById('page-content').innerHTML = `
    <div class="not-found">
      <div class="not-found-icon">🏛</div>
      <div style="font-size:16px;font-weight:600;margin-bottom:8px">${msg}</div>
      <div style="font-size:13px;color:var(--text-muted)">Vérifiez le lien ou contactez l'expert en charge du dossier.</div>
    </div>`;
}

function etatBadge(v) {
  if(!v) return '';
  if(v.includes('Bon'))return`<span class="badge badge-ok">${v}</span>`;
  if(v.includes('satisfaisant'))return`<span class="badge badge-info">${v}</span>`;
  if(v.includes('moyen'))return`<span class="badge badge-warning">${v}</span>`;
  if(v.includes('Mauvais')||v.includes('Très'))return`<span class="badge badge-danger">${v}</span>`;
  return`<span class="badge badge-info">${v}</span>`;
}
function urgenceBadge(v) {
  if(!v)return'';
  if(v.includes('Surveillance'))return`<span class="badge badge-ok">${v}</span>`;
  if(v.includes('planifier'))return`<span class="badge badge-info">${v}</span>`;
  if(v.includes('court'))return`<span class="badge badge-warning">${v}</span>`;
  if(v.includes('urgente'))return`<span class="badge badge-danger">${v}</span>`;
  return`<span class="badge badge-info">${v}</span>`;
}

function field(label,value,full=false) {
  if(!value||!String(value).trim())return'';
  return`<div class="field-item${full?' style="grid-column:1/-1"':''}">
    <div class="field-label">${label}</div>
    <div class="field-value">${String(value)}</div>
  </div>`;
}
function textBlock(label,value) {
  if(!value||!String(value).trim())return'';
  return`<div style="margin-bottom:16px">
    <div class="field-label" style="margin-bottom:6px">${label}</div>
    <div class="text-block">${String(value)}</div>
  </div>`;
}
function sectionHtml(icon,title,content) {
  return`<div class="section">
    <div class="section-header"><span class="section-icon">${icon}</span><span class="section-title">${title}</span></div>
    <div class="card">${content}</div>
  </div>`;
}

function renderWork(w, createdAt) {
  const photos = w.photos||[];
  const catOrder=['generale','localisation','lumiere_rasante','uv','ir','detail','degradation','prelevement','apres','autre'];

  // HERO
  let heroHtml = `<div class="hero">
    <div class="hero-title">${w.titre||'Sans titre'}</div>
    <div class="hero-sub">Étude préalable — Peintures murales & Polychromies</div>
    <div class="hero-meta">
      ${w.commune?`<div class="meta-chip">📍 ${w.commune}</div>`:''}
      ${w.type?`<div class="meta-chip">🏛 ${w.type}</div>`:''}
      ${w.date?`<div class="meta-chip">📅 ${w.date}</div>`:''}
      ${w.restaurateur?`<div class="meta-chip">👤 ${w.restaurateur}</div>`:''}
    </div>
  </div>`;

  // 1. IDENTIFICATION
  let ident = `<div class="field-grid">
    ${field('Référence',w.ref)}
    ${field('Type de bâtiment',w.type)}
    ${field('Espace / Localisation',w.espace,'full')}
    ${field('Adresse',w.adresse)}
    ${field('Commune',w.commune)}
    ${field('Propriétaire',w.proprietaire)}
    ${field('Gestionnaire / Contact',w.gestionnaire)}
    ${field('Période de construction',w.periode)}
    ${field('Classement / Protection',w.classement)}
    ${field('Restaurateur / Expert',w.restaurateur)}
    ${field('Commanditaire',w.commanditaire)}
    ${field('N° de rapport',w.rapport)}
  </div>
  ${w.historique?`<hr class="divider">${textBlock('Historique et contexte',w.historique)}`:''}`;

  // Photos générales & localisation
  const photosGen = photos.filter(p=>p.categorie==='generale'||p.categorie==='localisation');
  let photosGenHtml='';
  if(photosGen.length){
    photosGenHtml=sectionHtml('📷','Documentation générale',renderPhotos(photos,['generale','localisation']));
  }

  // 2. DESCRIPTION
  let descHtml=`<div class="field-grid">
    ${field('Type de peinture',w.peinture_type,'full')}
    ${field('Surface approximative',w.surface)}
    ${field('Support',w.support)}
    ${field('Datation estimée',w.datation,'full')}
  </div>
  ${w.iconographie?`<hr class="divider">${textBlock('Iconographie / Thème',w.iconographie)}`:''}
  ${w.description_tech?textBlock('Description technique / Style',w.description_tech):''}
  ${w.examens?`<hr class="divider">${textBlock('Examens effectués (UV, IR, lumière rasante…)',w.examens)}`:''}
  ${w.analyses?textBlock('Analyses de laboratoire',w.analyses):''}
  ${w.campagnes?textBlock('Observations sur les campagnes de peinture',w.campagnes):''}`;

  // Photos UV/IR
  const hasExamPhotos = photos.some(p=>['lumiere_rasante','uv','ir'].includes(p.categorie));
  let examPhotosHtml='';
  if(hasExamPhotos){
    examPhotosHtml=sectionHtml('🔍','Examens sous lumières spéciales',renderPhotos(photos,['lumiere_rasante','uv','ir']));
  }

  // 3. STRATIGRAPHIE MULTI-ZONES
  let stratiHtml='';
  const stratiZones=w.stratigraphie||[];
  if(stratiZones.length){
    const zonesHtml=stratiZones.map((zone,zi)=>{
      const rows=(zone.couches||[]).map((r,i)=>`<tr>
        <td class="strati-n">${i+1}</td>
        <td>${r.description||''}</td>
        <td>${r.couleur||''}</td>
        <td>${r.liant||''}</td>
        <td>${r.pigments||''}</td>
        <td>${r.datation||''}</td>
      </tr>`).join('');
      const zonePhotos=(zone.photos||[]);
      const photosHtml=zonePhotos.length?`
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
          <div class="field-label" style="margin-bottom:8px">Photos de la zone</div>
          <div class="photo-grid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px">
            ${zonePhotos.map(p=>`<div class="photo-card" onclick="openLightbox('${p.url||p.data}')">
              <img src="${p.url||p.data}" loading="lazy" style="aspect-ratio:1;object-fit:cover">
            </div>`).join('')}
          </div>
        </div>`:'';
      return `<div style="margin-bottom:16px">
        <div style="background:var(--ocre-pale);border-radius:8px 8px 0 0;padding:8px 14px;display:flex;align-items:center;gap:10px">
          <div style="width:24px;height:24px;border-radius:50%;background:var(--ocre);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">${zi+1}</div>
          <div style="font-size:13px;font-weight:600;color:var(--ocre-text)">${zone.titre||('Zone '+(zi+1))}</div>
        </div>
        <div style="border:1px solid rgba(124,79,30,0.15);border-top:none;border-radius:0 0 8px 8px;padding:14px">
          ${rows?`<table class="strati-table">
            <thead><tr><th>N°</th><th>Description de la couche</th><th>Couleur</th><th>Liant</th><th>Pigments</th><th>Datation</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>`:
          '<div style="color:var(--text-muted);font-size:12px;font-style:italic">Aucune couche renseignée</div>'}
          ${photosHtml}
        </div>
      </div>`;
    }).join('');
    stratiHtml=sectionHtml('🔬','Stratigraphie',zonesHtml+(w.strati_obs?`<div style="margin-top:8px">${textBlock('Observations générales',w.strati_obs)}</div>`:''));
  }

  // 4. ÉTAT
  let etatHtml=`<div class="field-grid">
    <div class="field-item"><div class="field-label">État général</div><div style="margin-top:4px">${etatBadge(w.etat_general)||'—'}</div></div>
    <div class="field-item"><div class="field-label">Stabilité structurelle</div><div class="field-value">${w.stabilite||'—'}</div></div>
  </div>
  ${w.degrad_support?`<hr class="divider">${textBlock('Dégradations du support',w.degrad_support)}`:''}
  ${w.degrad_picturale?textBlock('Dégradations de la couche picturale',w.degrad_picturale):''}
  ${w.degrad_surface?textBlock('Dégradations de surface',w.degrad_surface):''}
  ${w.causes?textBlock('Causes des dégradations',w.causes):''}
  ${w.zones_risque?textBlock('Zones prioritaires',w.zones_risque):''}`;

  // Photos dégradations
  const hasDetailPhotos = photos.some(p=>['detail','degradation','prelevement'].includes(p.categorie));
  let detailPhotosHtml='';
  if(hasDetailPhotos){
    detailPhotosHtml=sectionHtml('📷','Documentation des dégradations',renderPhotos(photos,['detail','degradation','prelevement']));
  }

  // 5. RECOMMANDATIONS
  let recoHtml=`<div class="field-grid">
    <div class="field-item"><div class="field-label">Urgence d'intervention</div><div style="margin-top:4px">${urgenceBadge(w.urgence)||'—'}</div></div>
    ${field('Type d\'intervention',w.intervention_type)}
  </div>
  ${w.travaux_batiment?`<hr class="divider">${textBlock('Travaux préalables recommandés (bâtiment)',w.travaux_batiment)}`:''}
  ${w.propositions?textBlock('Propositions de traitement des peintures',w.propositions):''}
  ${w.mise_en_valeur?textBlock('Proposition de mise en valeur',w.mise_en_valeur):''}
  ${w.budget?textBlock('Estimation budgétaire',w.budget):''}
  ${w.remarques?textBlock('Remarques complémentaires',w.remarques):''}`;

  // Photos après
  const hasApresPhotos = photos.some(p=>['apres','autre'].includes(p.categorie));
  let apresPhotosHtml='';
  if(hasApresPhotos){
    apresPhotosHtml=sectionHtml('📷','Autres documents photographiques',renderPhotos(photos,['apres','autre']));
  }

  document.getElementById('page-content').innerHTML = [
    heroHtml,
    sectionHtml('🏛','1. Identification du bâtiment / espace',ident),
    photosGenHtml,
    sectionHtml('📋','2. Description des peintures / polychromies',descHtml),
    examPhotosHtml,
    stratiHtml,
    sectionHtml('⚠️','4. État de conservation',etatHtml),
    detailPhotosHtml,
    sectionHtml('📝','5. Recommandations & Propositions d\'intervention',recoHtml),
    apresPhotosHtml,
    `<div style="text-align:center;padding:20px;font-size:11px;color:var(--text-muted)">
      Document généré par ARTBEE Polychromies · Étude préalable — Peintures murales & Polychromies
    </div>`
  ].filter(Boolean).join('');
}

function renderPhotos(photos, cats) {
  const filtered = photos.filter(p=>cats.includes(p.categorie));
  if(!filtered.length)return'<div style="color:var(--text-muted);font-size:12px">Aucune photo</div>';

  // Group by category
  const bycat = {};
  cats.forEach(c=>{ const ps=filtered.filter(p=>p.categorie===c); if(ps.length) bycat[c]=ps; });

  return Object.entries(bycat).map(([cat,ps])=>`
    <div class="photo-section">
      <div class="photo-cat-title">${catLabels[cat]||cat} (${ps.length})</div>
      <div class="photo-grid">
        ${ps.map(p=>`<div class="photo-card" onclick="openLightbox('${p.url||p.data}')">
          <img src="${p.url||p.data}" loading="lazy" alt="${p.legende||''}">
          <div class="photo-caption">${p.legende||'—'}</div>
        </div>`).join('')}
      </div>
    </div>
  `).join('');
}

function openLightbox(src) {
  document.getElementById('lb-img').src=src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lb-img').src='';
}

document.getElementById('logo-img').src = 'data:image/png;base64,' + LOGO_B64;
init();
</script>
</body>
</html>
